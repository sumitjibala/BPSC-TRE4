services:
  - type: web
    name: tre4-cs-academy
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Phase 2 ke liye — abhi khaali chhodo, baad me Render dashboard se add karna:
      # GEMINI_API_KEY, YOUTUBE_API_KEY, SUPABASE_URL, SUPABASE_ANON_KEY
